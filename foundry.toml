[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
deny = "warnings"
auto_detect_remappings = false

[fuzz]
runs = 256

[invariant]
runs = 32
depth = 15
fail_on_revert = false

[lint]
severity = ["high", "med", "low"]
ignore = ["test/**/*.sol"]
# missing-zero-check: 构造期的静态零值校验由部署脚本负责（dev-standards §5.7）；
# 具体构造行用行内抑制，不整类禁用。
# calls-loop / reentrancy-events / unused-return 一律按行内 disable-next-item 逐条抑制，
# 不整类关闭。这三类在本版 Foundry（1.8.1）不认 disable-next-line，只认 disable-next-item。
